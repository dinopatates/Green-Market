name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------
  # 1. ANALYSE ET BUILD DU FRONTEND (React / Vite)
  # ----------------------------------------------------
  frontend-ci:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Recouvrement du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Installation des dépendances Frontend
        run: npm ci
        working-directory: ./frontend

      - name: Etape LINT (eslint)
        run: npm run lint
        working-directory: ./frontend

      - name: Etape BUILD FRONT-END
        run: npm run build
        working-directory: ./frontend

  # ----------------------------------------------------
  # 2. ANALYSE ET TESTS DU BACKEND (Laravel 13)
  # ----------------------------------------------------
  backend-ci:
    name: Backend (Lint, Build & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Recouvrement du code
        uses: actions/checkout@v4

      - name: Configuration de PHP 8.3
        uses: actions/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, libxml, filter, json, pdo, mysql
          cache: composer

      - name: Installation des dépendances Backend
        run: composer install --no-progress --prefer-dist
        working-directory: ./Green-Market-Laravel

      - name: Etape LINT (Laravel Pint)
        run: ./vendor/bin/pint --test
        working-directory: ./Green-Market-Laravel

      - name: Etape BUILD BACK-END (Configuration d'environnement)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if ! grep -q '^APP_KEY=' .env || grep -q '^APP_KEY=$' .env; then
            php artisan key:generate
          fi
          touch database/database.sqlite
        working-directory: ./Green-Market-Laravel

      - name: Etape TESTS SI DISPONIBLES
        run: php artisan test --parallel
        working-directory: ./Green-Market-Laravel

  # ----------------------------------------------------
  # 3. VÉRIFICATION DU BUILD DOCKER
  # ----------------------------------------------------
  docker-ci:
    name: Vérification Docker Build
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci] 
    steps:
      - name: Recouvrement du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Etape VERIFICATION DOCKER BUILD
        run: docker compose build