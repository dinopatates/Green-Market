name: Continuous Integration (Vérifications)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------
  # 1. ANALYSE ET BUILD DU FRONTEND (React / Vite)
  # ----------------------------------------------------
  frontend-ci:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Recouvrement du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Installation des dépendances Frontend
        run: npm ci
        working-directory: ./frontend

      - name: 🔍 Étape : LINT (eslint)
        run: npm run lint
        working-directory: ./frontend

      - name: 🚀 Étape : BUILD FRONT-END
        run: npm run build
        working-directory: ./frontend

  # ----------------------------------------------------
  # 2. ANALYSE ET TESTS DU BACKEND (Laravel 13)
  # ----------------------------------------------------
  backend-ci:
    name: Backend (Lint, Build & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Recouvrement du code
        uses: actions/checkout@v4

      - name: Configuration de PHP 8.3
        uses: actions/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, libxml, filter, json, pdo, mysql
          cache: composer

      - name: Installation des dépendances Backend
        run: composer install --no-progress --prefer-dist
        working-directory: ./Green-Market-Laravel

      - name: 🔍 Étape : LINT (Laravel Pint)
        run: ./vendor/bin/pint --test
        working-directory: ./Green-Market-Laravel

      - name: 🚀 Étape : BUILD BACK-END (Configuration d'environnement)
        run: |
          cp .env.example .env
          php artisan key:generate
        working-directory: ./Green-Market-Laravel

      - name: 🧪 Étape : TESTS SI DISPONIBLES
        run: composer test
        working-directory: ./Green-Market-Laravel

  # ----------------------------------------------------
  # 3. VÉRIFICATION DU BUILD DOCKER
  # ----------------------------------------------------
  docker-ci:
    name: Vérification Docker Build
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci] 
    steps:
      - name: Recouvrement du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Étape : VÉRIFICATION DOCKER BUILD
        run: docker compose build