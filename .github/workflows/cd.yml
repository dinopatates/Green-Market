name: image-builder

on:
  push:
    branches: [main]

jobs:
  # Construction et déploiement de l'image Docker du backend
  backend-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Authentification auprès de Docker Hub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construction et push de l'image backend
      - uses: docker/build-push-action@v6
        with:
          context: ./Green-Market-Laravel
          file: ./Green-Market-Laravel/Dockerfile
          push: true
          tags: |
            gustavedoc/green_market-backend:latest
            gustavedoc/green_market-backend:${{ github.sha }}

  # Construction et déploiement de l'image Docker du frontend
  frontend-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Authentification auprès de Docker Hub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construction et push de l'image frontend
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            gustavedoc/green_market-frontend:latest
            gustavedoc/green_market-frontend:${{ github.sha }}

  # Déploiement sur le VPS
  deploy:
    needs: [backend-deployment, frontend-deployment]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.105.12.17
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/app
            git pull origin main
            docker compose pull
            docker compose down
            docker compose up -d