name: image-builder

on:
  push:
    branches: [master]

jobs:
  # Construction et déploiement de l'image Docker du backend
  backend-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Authentification auprès de Docker Hub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construction et push de l'image backend
      - uses: docker/build-push-action@v6
        with:
          context: ./Green-Market-Laravel
          file: ./Green-Market-Laravel/Dockerfile
          push: true
          tags: |
            gustavedoc/green_market-backend:latest
            gustavedoc/green_market-backend:${{ github.sha }}

  # Construction et déploiement de l'image Docker du frontend
  frontend-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Authentification auprès de Docker Hub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construction et push de l'image frontend
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            gustavedoc/green_market-frontend:latest
            gustavedoc/green_market-frontend:${{ github.sha }}

  # Déploiement sur le VPS
  deploy:
    needs: [backend-deployment, frontend-deployment]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Copier docker-compose vers le VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | sed 's/\r$//' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.yml root@178.105.12.17:/root/app/

      - name: Déployer sur le VPS via SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | sed 's/\r$//' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@178.105.12.17 <<'EOF'
            cd /root/app
            docker compose pull
            docker compose down || true
            docker compose up -d
          EOF